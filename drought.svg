<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <!-- Magadha in the twentieth year without rain: a farmer stands in a cracked
       field, watching an empty sky. Watercolor washes with pen-and-ink accents;
       sits directly on the page. -->
  <defs>
    <filter id="dwash" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="dpen" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
  </defs>

  <!-- ===================== the sun that will not let up ===================== -->
  <circle cx="736" cy="82" r="52" fill="#c9982a" opacity="0.16" filter="url(#dwash)"/>
  <circle cx="736" cy="82" r="31" fill="#c9982a" opacity="0.15" filter="url(#dwash)"/>
  <g filter="url(#dpen)" stroke="#c9982a" fill="none" stroke-linecap="round" opacity="0.4">
    <path d="M736 14 v-12 M736 162 v12 M668 82 h-14 M804 82 h14" stroke-width="1.6"/>
    <path d="M688 34 l-9 -10 M784 34 l9 -10 M688 130 l-9 10 M784 130 l9 10" stroke-width="1.4"/>
  </g>

  <!-- ===================== the bleached field ===================== -->
  <ellipse cx="640" cy="352" rx="330" ry="86" fill="#b7a678" opacity="0.15" filter="url(#dwash)"/>
  <ellipse cx="160" cy="366" rx="330" ry="80" fill="#8d8a5e" opacity="0.085" filter="url(#dwash)"/>
  <ellipse cx="450" cy="378" rx="410" ry="50" fill="#c9b18c" opacity="0.26" filter="url(#dwash)"/>
  <ellipse cx="470" cy="392" rx="300" ry="30" fill="#b06a3b" opacity="0.12" filter="url(#dwash)"/>

  <!-- cracks opening in the dry earth -->
  <g filter="url(#dpen)" stroke="#8a6a3b" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M120 396 q60 -18 96 -34 q28 -12 56 -10" stroke-width="1.5"/>
    <path d="M216 362 q10 18 -6 34 M272 352 q14 16 12 34" stroke-width="1.2"/>
    <path d="M330 398 q56 -26 108 -30 q54 -4 96 -22" stroke-width="1.5"/>
    <path d="M438 368 q6 16 -8 30 M534 346 q18 12 22 30" stroke-width="1.2"/>
    <path d="M584 392 q66 -22 116 -22 q46 0 84 -14" stroke-width="1.4"/>
    <path d="M700 370 q8 14 -4 26" stroke-width="1.1"/>
  </g>

  <!-- the crop that did not come: withered stalks, bent and empty -->
  <g filter="url(#dpen)" stroke="#b7a678" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M402 360 q-8 -44 6 -66 q5 -9 -6 -16" stroke-width="1.8"/>
    <path d="M428 354 q6 -22 1 -34 q-1 -7 6 -10" stroke-width="1.5"/>
    <path d="M464 356 q10 -48 3 -70 q-3 -11 10 -14" stroke-width="1.8"/>
    <path d="M498 350 q-4 -26 5 -40 q4 -6 -4 -10" stroke-width="1.5"/>
    <path d="M520 358 q-7 -54 5 -78 q4 -9 -7 -15" stroke-width="1.7"/>
    <path d="M556 348 q9 -20 4 -32" stroke-width="1.4"/>
    <path d="M590 354 q-6 -42 6 -62 q4 -8 -6 -13" stroke-width="1.7"/>
    <path d="M626 346 q8 -24 2 -38 q-2 -7 8 -10" stroke-width="1.5"/>
    <path d="M658 352 q-5 -34 5 -52 q4 -7 -4 -11" stroke-width="1.6"/>
    <path d="M694 344 q7 -18 3 -28" stroke-width="1.3"/>
    <path d="M726 350 q-6 -38 5 -56 q3 -7 -5 -11" stroke-width="1.5"/>
    <path d="M764 342 q8 -22 3 -34 q-2 -6 7 -9" stroke-width="1.4"/>
    <path d="M800 348 q-5 -28 5 -42" stroke-width="1.4"/>
  </g>
  <g filter="url(#dpen)" stroke="#8a6a3b" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M402 288 q-11 -7 -17 -3 M464 282 q12 -8 19 -4 M520 274 q-12 -7 -18 -3" stroke-width="1.3"/>
    <path d="M590 288 q-11 -6 -17 -2 M658 298 q12 -6 18 -2 M726 292 q-11 -6 -17 -2" stroke-width="1.2"/>
  </g>

  <!-- an emptied water vessel, set down in the dust -->
  <g filter="url(#dwash)">
    <path d="M356 356 q-13 -6 -13 -18 q0 -13 13 -16 q13 3 13 16 q0 12 -13 18 Z" fill="#b06a3b" opacity="0.42"/>
    <ellipse cx="356" cy="322" rx="7" ry="3" fill="#8a6a3b" opacity="0.5"/>
  </g>
  <g filter="url(#dpen)" stroke="#4a3826" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M356 356 q-13 -6 -13 -18 q0 -13 13 -16 q13 3 13 16 q0 12 -13 18 Z" stroke-width="1.2"/>
    <path d="M349 322 q7 3 14 0" stroke-width="1"/>
  </g>

  <!-- ===================== the farmer, watching an empty sky ===================== -->
  <g>
    <!-- the hoe, its blade idle in ground too hard to break -->
    <g filter="url(#dpen)" stroke="#8a6a3b" fill="none" stroke-linecap="round" opacity="0.75">
      <path d="M286 282 L332 354" stroke-width="2.8"/>
      <path d="M326 346 q15 4 17 15" stroke-width="3.6"/>
    </g>

    <g filter="url(#dwash)" stroke-linecap="round">
      <!-- legs, planted apart in the cracked ground -->
      <path d="M244 298 q-4 30 -2 58" stroke="#c99b72" stroke-width="13" fill="none" opacity="0.88"/>
      <path d="M264 298 q5 30 4 60" stroke="#c99b72" stroke-width="13" fill="none" opacity="0.88"/>
      <!-- the dhoti, wrapped and worn thin: the pale note that splits the figure -->
      <path d="M230 306 q-3 -30 8 -40 q18 -7 34 0 q11 10 8 40 q-25 8 -50 0 Z" fill="#f2ead8" opacity="0.92"/>
      <!-- torso -->
      <path d="M236 270 q-6 -34 4 -52 q9 -12 22 -12 q13 0 18 14 q6 24 4 50 q-24 8 -48 0 Z" fill="#c99b72" opacity="0.86"/>
      <!-- a worn shawl slung over one shoulder -->
      <path d="M240 218 q18 -10 34 0 q-3 26 -6 48 q-14 5 -22 -2 q-3 -24 -6 -46 Z" fill="#6f7a4a" opacity="0.3"/>
      <!-- the arm raised against the glare, elbow held clear of the body -->
      <path d="M240 222 L216 196" stroke="#c99b72" stroke-width="11" fill="none" opacity="0.86"/>
      <path d="M216 196 L241 179" stroke="#c99b72" stroke-width="10" fill="none" opacity="0.86"/>
      <ellipse cx="245" cy="176" rx="10" ry="6.5" transform="rotate(-34 245 176)" fill="#c99b72" opacity="0.9"/>
      <!-- the other arm hanging to the hoe -->
      <path d="M270 222 q14 32 16 58" stroke="#c99b72" stroke-width="11" fill="none" opacity="0.86"/>
      <!-- neck and head, tipped up to the sky -->
      <path d="M247 198 h13 v18 h-13 Z" fill="#c99b72" opacity="0.88"/>
      <circle cx="254" cy="186" r="17" fill="#c99b72" opacity="0.9"/>
      <!-- the cloth wound round his head -->
      <path d="M236 184 q-2 -22 18 -22 q20 0 19 20 q-7 -11 -19 -11 q-13 0 -18 13 Z" fill="#f2ead8" opacity="0.9"/>
      <path d="M238 180 q-11 5 -9 16 q4 9 12 6" fill="#f2ead8" opacity="0.75"/>
    </g>

    <g filter="url(#dpen)" stroke="#4a3826" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M236 270 q-6 -34 4 -52 q9 -12 22 -12 q13 0 18 14 q6 24 4 50" stroke-width="1.5"/>
      <path d="M230 306 q-3 -30 8 -40 q18 -7 34 0 q11 10 8 40" stroke-width="1.4"/>
      <path d="M244 298 q-4 30 -2 58 M264 298 q5 30 4 60" stroke-width="1.2" opacity="0.7"/>
      <path d="M240 222 L216 196 L241 179" stroke-width="1.3" opacity="0.7"/>
      <path d="M270 222 q14 32 16 58" stroke-width="1.3" opacity="0.7"/>
      <path d="M236 184 q-2 -22 18 -22 q20 0 19 20" stroke-width="1.3"/>
      <!-- brow drawn down, mouth set: the look of a man counting the years -->
      <path d="M247 187 q6 -3 10 -1 M263 188 q5 -2 7 0" stroke-width="1.2" opacity="0.85"/>
      <path d="M251 199 q7 -3 12 1" stroke-width="1.2" opacity="0.75"/>
      <path d="M238 302 q22 6 42 0" stroke-width="1.1" opacity="0.5"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <!-- Gorakhnath in unbroken meditation on the seized Naags at Mrigasthali,
       the hills behind him dry because the rain-bringers cannot move.
       Watercolor washes with pen-and-ink accents; sits directly on the page. -->
  <defs>
    <filter id="gwash" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="gpen" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.8"/>
    </filter>
    <!-- gentler wash: thick coils keep their body instead of smearing -->
    <filter id="gcoil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- ===================== the withheld sky and the dry hills ===================== -->
  <circle cx="754" cy="86" r="42" fill="#c9982a" opacity="0.13" filter="url(#gwash)"/>
  <circle cx="754" cy="86" r="25" fill="#c9982a" opacity="0.10" filter="url(#gwash)"/>

  <ellipse cx="212" cy="358" rx="300" ry="112" fill="#8d8a5e" opacity="0.15" filter="url(#gwash)"/>
  <ellipse cx="700" cy="364" rx="278" ry="92" fill="#b7a678" opacity="0.16" filter="url(#gwash)"/>
  <ellipse cx="450" cy="382" rx="400" ry="46" fill="#c9b18c" opacity="0.24" filter="url(#gwash)"/>
  <ellipse cx="450" cy="372" rx="210" ry="26" fill="#b06a3b" opacity="0.10" filter="url(#gwash)"/>

  <!-- a bare tree at the left edge, and the last dry grasses -->
  <g filter="url(#gpen)" stroke="#8a6a3b" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M112 356 q4 -52 -2 -78" stroke-width="3"/>
    <path d="M110 302 q-20 -14 -30 -30 M110 292 q22 -16 34 -30 M111 320 q-18 -8 -28 -18" stroke-width="1.8"/>
  </g>
  <g filter="url(#gpen)" stroke="#8d8a5e" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M176 360 q4 -22 -4 -34 M182 360 q10 -20 20 -28 M170 360 q-8 -18 -18 -24" stroke-width="1.3"/>
    <path d="M782 352 q2 -22 -6 -32 M788 352 q10 -18 20 -24 M776 352 q-8 -16 -16 -22" stroke-width="1.3"/>
    <path d="M688 370 q4 -16 -2 -26 M696 370 q9 -14 18 -19" stroke-width="1.2"/>
  </g>

  <!-- ===================== the coiled Naags, bound beneath him ===================== -->
  <ellipse cx="450" cy="352" rx="196" ry="40" fill="#2a2320" opacity="0.12" filter="url(#gwash)"/>

  <g filter="url(#gcoil)" fill="none" stroke-linecap="round">
    <!-- bodies trailing out onto the dry ground -->
    <path d="M264 378 q60 -16 112 -4" stroke="#6f7a4a" stroke-width="12" opacity="0.4"/>
    <path d="M636 374 q-56 -14 -108 -2" stroke="#8a6a3b" stroke-width="12" opacity="0.4"/>
    <path d="M634 376 q28 -8 28 -28 q0 -18 -18 -18" stroke="#6f7a4a" stroke-width="9" opacity="0.45"/>
    <!-- the heap itself: thick bodies packed and crossing, as wide as the seat -->
    <path d="M336 370 q64 -26 132 -8 q62 19 116 -12" stroke="#8a6a3b" stroke-width="21" opacity="0.62"/>
    <path d="M328 356 q60 -30 128 -12 q64 18 122 -8" stroke="#4a5b66" stroke-width="22" opacity="0.68"/>
    <path d="M338 364 q60 22 122 4 q58 -18 108 6" stroke="#9d948a" stroke-width="15" opacity="0.45"/>
    <path d="M324 342 q56 -26 118 -10 q60 16 116 -6" stroke="#6f7a4a" stroke-width="20" opacity="0.62"/>
    <path d="M340 350 q58 22 118 4 q56 -18 104 6" stroke="#31564a" stroke-width="16" opacity="0.5"/>
    <path d="M346 328 q50 -22 106 -8 q52 14 98 -4" stroke="#6b2f42" stroke-width="18" opacity="0.56"/>
    <!-- two coils rearing clear of the seat: heads, still bound -->
    <path d="M348 364 q-60 -14 -58 -48 q2 -22 28 -22" stroke="#6b2f42" stroke-width="15" opacity="0.62"/>
    <path d="M560 360 q60 -14 58 -48 q-2 -22 -28 -22" stroke="#31564a" stroke-width="15" opacity="0.62"/>
  </g>
  <g filter="url(#gcoil)">
    <ellipse cx="304" cy="290" rx="17" ry="10" transform="rotate(-22 304 290)" fill="#6b2f42" opacity="0.68"/>
    <ellipse cx="596" cy="286" rx="17" ry="10" transform="rotate(22 596 286)" fill="#31564a" opacity="0.68"/>
  </g>
  <g filter="url(#gpen)" stroke="#4a3826" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M348 364 q-60 -14 -58 -48 q2 -22 28 -22" stroke-width="1.3"/>
    <path d="M560 360 q60 -14 58 -48 q-2 -22 -28 -22" stroke-width="1.3"/>
    <path d="M289 286 l-13 -3 M611 282 l13 -3" stroke-width="1"/>
    <path d="M328 356 q60 -30 128 -12 q64 18 122 -8" stroke-width="1.1" opacity="0.45"/>
    <path d="M336 370 q64 -26 132 -8 q62 19 116 -12" stroke-width="1.1" opacity="0.4"/>
    <path d="M324 342 q56 -26 118 -10 q60 16 116 -6" stroke-width="1" opacity="0.36"/>
    <path d="M346 328 q50 -22 106 -8 q52 14 98 -4" stroke-width="1" opacity="0.34"/>
  </g>

  <!-- ===================== the yogi, raised on the coil ===================== -->
  <g transform="translate(0,-34)">
    <g filter="url(#gwash)">
      <!-- crossed legs: wide and low, so the seat reads apart from the body -->
      <path d="M318 322 q14 -46 70 -56 q62 -11 124 0 q56 10 70 56 q-72 20 -132 20 q-60 0 -132 -20 Z" fill="#a03326" opacity="0.8"/>
      <!-- the crossed feet, resting on the thighs -->
      <ellipse cx="450" cy="300" rx="25" ry="10" fill="#c99b72" opacity="0.85"/>
      <!-- torso, narrower than the seat -->
      <path d="M408 296 q-12 -66 4 -98 q16 -28 38 -28 q22 0 38 28 q16 32 4 98 q-42 12 -84 0 Z" fill="#a03326" opacity="0.86"/>
      <!-- the upper robe drawn across one shoulder -->
      <path d="M414 196 q32 -20 66 -4 q10 36 20 72 q-32 12 -56 -2 q-18 -34 -30 -66 Z" fill="#8b2015" opacity="0.42"/>
      <!-- arms folded down into the lap -->
      <path d="M412 216 q-30 30 -24 62 q5 16 24 20 q6 -38 12 -62 Z" fill="#a03326" opacity="0.82"/>
      <path d="M488 216 q30 30 24 62 q-5 16 -24 20 q-6 -38 -12 -62 Z" fill="#a03326" opacity="0.82"/>
      <!-- hands at rest, dhyana mudra -->
      <ellipse cx="450" cy="288" rx="25" ry="9" fill="#c99b72" opacity="0.92"/>
      <!-- neck and head -->
      <path d="M436 164 h28 v22 h-28 Z" fill="#c99b72" opacity="0.9"/>
      <circle cx="450" cy="140" r="29" fill="#c99b72" opacity="0.92"/>
      <!-- matted jata: topknot, crown, and the long falls behind the shoulders -->
      <path d="M419 138 q-3 -38 31 -38 q34 0 31 38 q-5 -24 -31 -24 q-26 0 -31 24 Z" fill="#5a3423" opacity="0.9"/>
      <ellipse cx="450" cy="96" rx="15" ry="11" fill="#5a3423" opacity="0.9"/>
      <path d="M425 134 q-26 40 -22 78 q17 9 30 -4 q-15 -38 -6 -72 Z" fill="#5a3423" opacity="0.78"/>
      <path d="M475 134 q26 40 22 78 q-17 9 -30 -4 q15 -38 6 -72 Z" fill="#5a3423" opacity="0.78"/>
      <!-- the split-ear rings of a Nath yogi -->
      <circle cx="422" cy="150" r="7" fill="none" stroke="#c9982a" stroke-width="2.6" opacity="0.9"/>
      <circle cx="478" cy="150" r="7" fill="none" stroke="#c9982a" stroke-width="2.6" opacity="0.9"/>
    </g>

    <g filter="url(#gpen)" stroke="#4a3826" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M318 322 q14 -46 70 -56 q62 -11 124 0 q56 10 70 56" stroke-width="1.6"/>
      <path d="M408 296 q-12 -66 4 -98 q16 -28 38 -28 q22 0 38 28 q16 32 4 98" stroke-width="1.5"/>
      <path d="M419 138 q-3 -38 31 -38 q34 0 31 38" stroke-width="1.3"/>
      <!-- eyes closed -->
      <path d="M434 142 q8 6 15 0 M466 142 q-8 6 -15 0" stroke-width="1.4"/>
      <path d="M443 158 q7 3 14 0" stroke-width="1.1" opacity="0.7"/>
      <!-- knees, so the crossed legs read -->
      <path d="M348 306 q18 -34 54 -44 M552 306 q-18 -34 -54 -44" stroke-width="1.3" opacity="0.75"/>
      <path d="M424 300 q26 9 52 0" stroke-width="1.2" opacity="0.7"/>
      <!-- folds of the robe -->
      <path d="M414 196 q32 -20 66 -4" stroke-width="1.2" opacity="0.7"/>
      <path d="M420 222 q22 32 30 68 M438 216 q18 36 24 72" stroke-width="1.1" opacity="0.42"/>
      <path d="M412 216 q-30 30 -24 62 M488 216 q30 30 24 62" stroke-width="1.2"/>
      <path d="M428 288 q22 8 44 0" stroke-width="1.1" opacity="0.7"/>
    </g>
  </g>
</svg>
